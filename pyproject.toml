[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-memory-e8"
version = "0.2.0"
description = "LatticeMemory — E8 lattice semantic cache and LLM proxy. Calibrated Hamming routing, zero-false-positive intent caching, compliance mode."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=3.0.0",
    "numpy",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
faiss = ["faiss-cpu"]
llamaindex = ["llama-index-core"]
hf = ["datasets>=2.0.0"]
proxy = ["fastapi", "uvicorn", "httpx"]
redis = ["redis>=4.0.0"]
training = ["datasets>=2.0.0", "tqdm"]
proofpack = ["datasets>=2.0.0", "gptcache>=0.1.44", "redis>=5.0.0", "redisvl>=0.23.0"]

[project.scripts]
lattice = "latticememory.cli:main"
latticememory-train-msmarco = "latticememory.train_msmarco:main"
latticememory-calibrate-proxy = "latticememory.calibrate_proxy:main"
latticememory-serve-proxy = "latticememory.proxy_server:main"

[project.urls]
Homepage = "https://github.com/sangmorg1-debug/latticememory"
"HuggingFace Space" = "https://huggingface.co/spaces/dfrokido/LatticeMemory"

[tool.setuptools.packages.find]
where = ["."]
include = ["latticememory*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run the full training loop (deselect with -m 'not slow')",
]
