[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latticememory"
version = "0.1.0"
description = "LatticeMemory — 10.7x compressed semantic index with E8 lattice addressing. O(1) retrieval for domain knowledge bases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=3.0.0",
    "numpy",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
faiss = ["faiss-cpu"]
llamaindex = ["llama-index-core"]
hf = ["datasets>=2.0.0"]
proxy = ["fastapi", "uvicorn", "httpx"]
training = ["datasets>=2.0.0", "tqdm"]

[project.scripts]
latticememory-train-msmarco = "latticememory.train_msmarco:main"
latticememory-calibrate-proxy = "latticememory.calibrate_proxy:main"

[project.urls]
Homepage = "https://github.com/sangmorg1-debug/e8-Project"
"HuggingFace Space" = "https://huggingface.co/spaces/dfrokido/LatticeMemory"

[tool.setuptools.packages.find]
where = ["."]
include = ["latticememory*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run the full training loop (deselect with -m 'not slow')",
]
